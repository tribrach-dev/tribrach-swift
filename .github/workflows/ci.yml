name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          swift build
          swift test
      - name: Example (build plugin, replay, check, stamp)
        working-directory: Examples/Counter
        run: |
          swift build
          swift test
          swift run --package-path ../.. tribrach-swift check --manifest tribrach.manifest.json Sources
          swift run --package-path ../.. tribrach-swift stamp -n --manifest tribrach.manifest.json Sources
      - name: Parking CLI (generate DTOs, verdicts, exchange replay)
        working-directory: Examples/ParkingCLI
        run: |
          ./generate.sh
          swift build
          swift test
      - name: Generated DTOs are up to date
        run: |
          if [ -n "$(git status --porcelain Examples/ParkingCLI)" ]; then
            git status --porcelain Examples/ParkingCLI
            echo "----- BEGIN Contracts.gen.swift -----"
            cat Examples/ParkingCLI/Sources/ParkingContracts/Contracts.gen.swift
            echo "----- END Contracts.gen.swift -----"
            echo "TRS0401 Contracts.gen.swift is out of date with core/schemas; fix: Examples/ParkingCLI/generate.sh (the generated file is printed above and attached to this run)"
            exit 1
          fi
      - name: Keep the generated DTOs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parking-contracts
          path: Examples/ParkingCLI/Sources/ParkingContracts/Contracts.gen.swift
          if-no-files-found: ignore

  conformance-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned core commit
        id: core
        run: echo "rev=$(cat Tests/TribrachCoreTests/CORE_REV)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: tribrach-dev/tribrach
          ref: ${{ steps.core.outputs.rev }}
          path: core
      - name: The vendored cases match core
        run: diff -r core/tests/conformance Tests/TribrachCoreTests/core --exclude=README.md
      - name: Read the parking example's core commit
        id: parking
        run: echo "rev=$(cat Examples/ParkingCLI/core/CORE_REV)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: tribrach-dev/tribrach
          ref: ${{ steps.parking.outputs.rev }}
          path: core-parking
      - name: The parking example's exports match core
        run: diff -r core-parking/examples/dto-parking/exported Examples/ParkingCLI/core --exclude=CORE_REV

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Commit $c has no Signed-off-by line"; missing=1
            fi
          done
          exit $missing
