name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          swift build
          swift test
      - name: Example (build plugin, replay, check, stamp)
        working-directory: Examples/Counter
        run: |
          swift build
          swift test
          swift run --package-path ../.. tribrach-swift check --manifest tribrach.manifest.json Sources
          swift run --package-path ../.. tribrach-swift stamp -n --manifest tribrach.manifest.json Sources

  conformance-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned core commit
        id: core
        run: echo "rev=$(cat Tests/TribrachCoreTests/CORE_REV)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: tribrach-dev/tribrach
          ref: ${{ steps.core.outputs.rev }}
          path: core
      - name: The vendored cases match core
        run: diff -r core/tests/conformance Tests/TribrachCoreTests/core --exclude=README.md

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Commit $c has no Signed-off-by line"; missing=1
            fi
          done
          exit $missing
